<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" style="width:100%;height:auto;max-width:820px;display:block;margin:0 auto;">
  <defs>
    <linearGradient id="platformBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFB"/>
      <stop offset="100%" stop-color="#F4F4F7"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(0,0,0,0.05)"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7C3AED"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.06)"/>
    </filter>
  </defs>

  <!-- Platform container -->
  <rect x="20" y="20" width="700" height="360" rx="14" fill="url(#platformBg)" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
  <rect x="20" y="20" width="700" height="360" rx="14" fill="url(#dots)"/>

  <!-- Platform header -->
  <text x="40" y="50" font-size="13" font-weight="600" fill="#0F172A">🚄 LiteLLM Agent Platform</text>
  <text x="40" y="68" font-size="11" fill="#9CA3AF">Kubernetes &#8226; kind / EKS / GKE / AKS / on-prem</text>

  <!-- Sandbox pod -->
  <rect x="40" y="92" width="380" height="266" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.10)" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="56" y="118" font-size="12" font-weight="600" fill="#0F172A">Sandbox pod</text>
  <text x="56" y="134" font-size="10" fill="#9CA3AF">harness sees only stub credentials</text>

  <!-- Harness chips: 2x2 grid -->
  <g transform="translate(56, 148)">
    <rect width="170" height="40" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.20)" stroke-width="1"/>
    <text x="14" y="25" font-size="12" font-weight="600" fill="#0F172A">Claude Code</text>
  </g>
  <g transform="translate(236, 148)">
    <rect width="170" height="40" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.20)" stroke-width="1"/>
    <text x="14" y="25" font-size="12" font-weight="600" fill="#0F172A">Codex</text>
  </g>
  <g transform="translate(56, 200)">
    <rect width="170" height="40" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.20)" stroke-width="1"/>
    <text x="14" y="25" font-size="12" font-weight="600" fill="#0F172A">opencode</text>
  </g>
  <g transform="translate(236, 200)">
    <rect width="170" height="40" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.20)" stroke-width="1"/>
    <text x="14" y="25" font-size="12" font-weight="600" fill="#0F172A">Agent SDK</text>
  </g>

  <!-- Stub credentials block -->
  <rect x="56" y="262" width="350" height="80" rx="8" fill="#0E0E10"/>
  <text x="70" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6B7280">// agent's env</text>
  <text x="70" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E5E5E5">GITHUB_TOKEN=stub_github_a8f1</text>
  <text x="70" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E5E5E5">LITELLM_API_KEY=stub_litellm_bb20</text>

  <!-- Arrow sandbox → vault -->
  <line x1="425" y1="225" x2="450" y2="225" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Vault sidecar -->
  <rect x="455" y="92" width="245" height="266" rx="12" fill="rgba(124,58,237,0.04)" stroke="#7C3AED" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="471" y="118" font-size="12" font-weight="600" fill="#7C3AED">🛡 Vault sidecar</text>
  <text x="471" y="134" font-size="10" fill="#9CA3AF">HTTPS proxy &#8212; swaps stub for real</text>

  <!-- swap: in -->
  <rect x="471" y="156" width="214" height="36" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <text x="485" y="172" font-size="9" fill="#9CA3AF">IN  (from agent)</text>
  <text x="485" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#0F172A">Bearer stub_litellm_bb20</text>

  <!-- swap arrow -->
  <line x1="578" y1="200" x2="578" y2="212" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arrowhead)"/>

  <!-- swap: out -->
  <rect x="471" y="216" width="214" height="36" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="485" y="232" font-size="9" fill="#7C3AED" font-weight="600">OUT (to wire)</text>
  <text x="485" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7C3AED">Bearer sk-real-litellm-key</text>

  <!-- footer text inside vault -->
  <text x="471" y="284" font-size="11" fill="#6B7280">Real credentials live only here.</text>
  <text x="471" y="302" font-size="11" fill="#6B7280">Never in the agent process.</text>
  <text x="471" y="320" font-size="11" fill="#6B7280">Never logged. Never stored.</text>

  <!-- Arrow leaving platform -->
  <line x1="705" y1="225" x2="788" y2="225" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="746" y="216" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">HTTPS</text>
  <text x="746" y="244" font-size="9" fill="#9CA3AF" text-anchor="middle">LLM / GitHub</text>
</svg>
